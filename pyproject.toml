[project]
name = "pixel-rot-compare"
version = "1.0.0"
description = "本地像素旋转对照窗: 最近像素 vs 保轮廓, 面向十几像素宽的小符号"
requires-python = ">=3.10"
dependencies = [
    "PySide6>=6.6",
    "Pillow>=10",
    "numpy>=1.26",
]

[project.optional-dependencies]
dev = ["pytest>=8", "pyflakes"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
