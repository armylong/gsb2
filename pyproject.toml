[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "palettizer"
version = "1.0.0"
description = "Local desktop tool for limited-palette pixel art: palette editing, dithering comparison, indexed PNG export"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "numpy>=1.24",
    "pillow>=10.0",
    "PySide6>=6.5",
]

[project.optional-dependencies]
test = ["pytest>=7.4"]

[project.scripts]
palettizer = "palettizer.app:main"
palettizer-cli = "palettizer.cli:main"

[tool.setuptools]
packages = ["palettizer", "palettizer.ui"]

[tool.pytest.ini_options]
testpaths = ["tests"]
