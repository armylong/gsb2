[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "interview-loudness-matcher"
version = "1.0.0"
description = "Match interview speakers' loudness with explicit peak, selection and re-measurement rules"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "numpy>=1.24",
    "soundfile>=0.12",
    "PySide6>=6.5",
]

[project.optional-dependencies]
dev = [
    "pytest>=8",
]

[project.scripts]
audio-matcher = "audio_matcher.__main__:main"

[tool.setuptools.packages.find]
include = ["audio_matcher*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
