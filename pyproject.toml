[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "mkv-track-inspector"
version = "0.1.0"
description = "Local PySide6/FFmpeg tool for checking and editing MKV audio/subtitle flags"
requires-python = ">=3.10"
dependencies = ["PySide6>=6.6,<7"]

[project.scripts]
mkv-track-inspector = "mkv_tool.gui:main_entry"
mkv-tool = "mkv_tool.cli:main"

[tool.setuptools.packages.find]
include = ["mkv_tool*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
