[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "pcaprecon"
version = "0.1.0"
description = "Offline packet-capture session reassembly and HTTP reconstruction tool (unencrypted traffic)"
requires-python = ">=3.10"
license = {text = "MIT"}
dependencies = []

[project.scripts]
pcaprecon = "pcaprecon.cli:main"

[tool.setuptools]
packages = ["pcaprecon", "pcaprecon.tests"]
