[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "syncplayer"
version = "1.0.0"
description = "本地双视频同步对比播放器(手动偏移, 无自动对齐)"
requires-python = ">=3.10"
dependencies = ["PySide6>=6.6", "numpy>=1.26"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src", "."]
testpaths = ["tests"]
addopts = "-q"
