[project]
name = "tdoa-lab"
version = "0.1.0"
description = "双通道到达时差手调对照台（Python + PySide6）"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
  "numpy>=1.26",
  "scipy>=1.11",
  "PySide6>=6.6",
  "pyqtgraph>=0.13.3",
]

[project.scripts]
tdoa-lab = "tdoa_lab.app:main"

[tool.uv]
package = true

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["tdoa_lab"]
