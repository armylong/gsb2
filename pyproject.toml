[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "phase-bench"
version = "0.1.0"
description = "Local PySide6 bench for distinguishing narrow-band comb cancellation from low overall level."
requires-python = ">=3.10"
dependencies = [
  "PySide6>=6.8",
  "numpy>=1.26",
  "soundfile>=0.12",
]

[project.scripts]
phase-bench = "phase_bench.__main__:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
