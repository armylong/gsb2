[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "tileviewer"
version = "0.1.0"
description = "Local single-frame RGB tiled previewer (PySide6 + Pillow/tifffile)"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "PySide6>=6.6",
    "Pillow>=10.0",
    "tifffile>=2023.7.10",
    "numpy>=1.24",
]

[project.scripts]
tileviewer = "tileviewer.__main__:main"

[tool.setuptools]
packages = ["tileviewer"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
filterwarnings = [
    "error::DeprecationWarning:tileviewer.*",
]

[tool.ruff]
line-length = 88
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "W", "B", "I", "UP"]
