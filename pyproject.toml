[project]
name = "band-vocoder"
version = "0.1.0"
description = "通道声码器本地短音工具: 一条调制声 + 一条载波声"
requires-python = ">=3.10"
dependencies = [
    "numpy",
    "scipy",
    "PySide6",
]

[project.scripts]
band-vocoder = "band_vocoder.cli:main"
band-vocoder-gui = "band_vocoder.gui:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
packages = ["band_vocoder"]
