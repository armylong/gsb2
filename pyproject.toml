[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "sql-lineage"
version = "0.1.0"
description = "Offline sqlite SQL field-lineage analyzer with a local web viewer"
requires-python = ">=3.10"
dependencies = ["sqlglot>=25,<31"]

[project.optional-dependencies]
test = ["pytest>=8"]

[project.scripts]
sql-lineage = "sql_lineage.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
sql_lineage = ["web/*.html", "web/*.css", "web/*.js"]

[pytest]
pythonpath = ["src"]
testpaths = ["tests"]
