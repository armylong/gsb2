[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "ccstats"
version = "0.1.0"
description = "二维静态图连通域分割统计（PySide6 + OpenCV + NumPy）"
requires-python = ">=3.10"
dependencies = [
  "numpy>=1.26",
  "opencv-python-headless>=4.8",
  "PySide6>=6.5",
]

[project.optional-dependencies]
dev = ["pytest>=8"]

[project.scripts]
ccstats = "ccstats.cli:main"
ccstats-gui = "ccstats.qt_app:main"

[tool.setuptools]
packages = ["ccstats"]
