<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<title>曲线排字检查器</title>
<style>
  :root { --line: #d0d0d8; --ink: #222; --accent: #2563eb; --bad: #dc2626; }
  * { box-sizing: border-box; }
  body { margin: 0; font: 14px/1.5 -apple-system, "PingFang SC", "Microsoft YaHei", sans-serif; color: var(--ink); background: #f4f4f6; }
  header { padding: 10px 16px; background: #fff; border-bottom: 1px solid var(--line); font-weight: 600; }
  header small { font-weight: 400; color: #777; margin-left: 8px; }
  main { display: flex; gap: 12px; padding: 12px 16px; align-items: flex-start; }
  #stage { background: #fff; border: 1px solid var(--line); border-radius: 8px; }
  canvas { display: block; border-radius: 8px; cursor: crosshair; }
  #panel { width: 320px; flex: none; display: flex; flex-direction: column; gap: 10px; }
  .card { background: #fff; border: 1px solid var(--line); border-radius: 8px; padding: 10px 12px; }
  .card h3 { margin: 0 0 8px; font-size: 13px; color: #555; font-weight: 600; }
  textarea { width: 100%; height: 84px; resize: vertical; font: 16px/1.4 "PingFang SC", sans-serif; padding: 6px 8px; border: 1px solid var(--line); border-radius: 6px; }
  .row { display: flex; align-items: center; gap: 8px; flex-wrap: wrap; }
  .row + .row { margin-top: 8px; }
  label.radio { display: inline-flex; align-items: center; gap: 4px; cursor: pointer; }
  input[type=range] { flex: 1; }
  button { padding: 5px 10px; border: 1px solid var(--line); background: #fafafa; border-radius: 6px; cursor: pointer; font-size: 13px; }
  button:hover { background: #eef2ff; border-color: var(--accent); }
  .warn { color: var(--bad); }
  .ok { color: #16a34a; }
  ul.stat { margin: 4px 0 0; padding-left: 18px; max-height: 120px; overflow: auto; }
  ul.stat li { margin: 2px 0; }
  .hint { color: #888; font-size: 12px; }
  #fontSizeVal { min-width: 3em; text-align: right; display: inline-block; }
</style>
</head>
<body>
<header>曲线排字检查器 <small>拖动控制点调整曲线 · 点击画布上的字可定位到文本</small></header>
<main>
  <div id="stage"><canvas id="cv" width="960" height="600"></canvas></div>
  <div id="panel">
    <div class="card">
      <h3>文本(常见中文 / 拉丁 / 数字 / 常用标点)</h3>
      <textarea id="txt" spellcheck="false"></textarea>
      <div class="row hint" id="filterNote" style="display:none">已自动移除不支持的字符</div>
    </div>
    <div class="card">
      <h3>摆法与字号</h3>
      <div class="row">
        <label class="radio"><input type="radio" name="align" value="start" checked> 顺排</label>
        <label class="radio"><input type="radio" name="align" value="center"> 居中</label>
        <label class="radio"><input type="radio" name="align" value="reverse"> 反向</label>
      </div>
      <div class="row">
        <span>字号</span>
        <input type="range" id="fontSize" min="12" max="72" value="28">
        <span id="fontSizeVal">28</span>
      </div>
    </div>
    <div class="card">
      <h3>用例</h3>
      <div class="row">
        <button data-preset="gentle">松弯用例</button>
        <button data-preset="tight">紧弯碰撞用例</button>
        <button data-preset="reset">重置</button>
      </div>
    </div>
    <div class="card">
      <h3>检查结果</h3>
      <div id="status"></div>
    </div>
    <div class="card">
      <h3>导出</h3>
      <div class="row">
        <button id="exportPng">保存透明 PNG</button>
        <button id="exportJson">导出摆位 JSON</button>
      </div>
    </div>
  </div>
</main>
<script src="main.js"></script>
</body>
</html>
