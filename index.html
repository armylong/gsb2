<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>二维刚体接触观察台</title>
    <link rel="stylesheet" href="/src/style.css" />
  </head>
  <body>
    <div id="app">
      <div id="stage">
        <canvas id="canvas" width="960" height="600"></canvas>
        <div id="hint">暂停时:拖动刚体放置(重叠会标红并拒绝)。运行中:在刚体上按住拖出箭头,松开施加一次推力。点击刚体选中。</div>
      </div>
      <div id="panel">
        <section>
          <h2>场景</h2>
          <div class="row" id="sceneButtons"></div>
          <div class="row">
            <button id="btnReset">重置场景(恢复初始参数)</button>
          </div>
        </section>
        <section>
          <h2>模拟控制</h2>
          <div class="row">
            <button id="btnPause">暂停</button>
            <button id="btnStep" disabled>单步</button>
            <select id="speed">
              <option value="0.5">0.5×</option>
              <option value="1" selected>1×</option>
              <option value="2">2×</option>
            </select>
          </div>
          <div id="status" class="readout"></div>
        </section>
        <section>
          <h2>添加刚体</h2>
          <div class="row">
            <button id="addCircle">圆形</button>
            <button id="addRect">矩形</button>
            <button id="addPoly">凸多边形</button>
          </div>
        </section>
        <section>
          <h2>选中刚体</h2>
          <div id="selInfo" class="readout">未选中</div>
          <div class="row params">
            <label>质量 <input id="pMass" type="number" min="0.1" step="0.1" /></label>
            <label>摩擦 <input id="pFriction" type="number" min="0" max="2" step="0.05" /></label>
            <label>弹性 <input id="pRest" type="number" min="0" max="1" step="0.05" /></label>
          </div>
          <div class="row">
            <button id="btnApply">应用参数</button>
            <button id="btnDelete">删除刚体</button>
          </div>
        </section>
        <section>
          <h2>接触显示</h2>
          <div class="row checks">
            <label><input id="cPoints" type="checkbox" checked /> 接触点</label>
            <label><input id="cNormals" type="checkbox" checked /> 法线</label>
            <label><input id="cDepth" type="checkbox" checked /> 穿透深度</label>
            <label><input id="cOnlySel" type="checkbox" /> 仅看选中刚体</label>
          </div>
        </section>
      </div>
    </div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
