<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<title>灯船巡游 · 岸边座位布局</title>
<style>
  body { margin: 0; background: #1a1630; color: #e8e4ff; font-family: sans-serif; display: flex; }
  canvas { display: block; }
  #side { width: 380px; height: 640px; overflow-y: auto; padding: 8px 12px; background: #241f3d; box-sizing: border-box; font-size: 13px; }
  h2 { font-size: 16px; margin: 4px 0; }
  h3 { font-size: 13px; margin: 10px 0 4px; color: #b8a8ff; }
  .row { margin: 4px 0; display: flex; gap: 6px; flex-wrap: wrap; align-items: center; }
  button { background: #3d3560; color: #e8e4ff; border: 1px solid #5a4fa0; border-radius: 5px; padding: 3px 8px; cursor: pointer; font-size: 12px; }
  button:hover:not(:disabled) { background: #4d4480; }
  button:disabled { opacity: 0.4; cursor: default; }
  button.on { background: #6a5fc0; }
  .dim { color: #9a90c0; }
  .small { font-size: 11px; }
  .ok { color: #5ee06a; }
  .bad { color: #ff7a7a; }
  .msg { color: #ffd166; margin: 4px 0; }
  .vrow { padding: 3px 4px; border-radius: 4px; cursor: pointer; }
  .vrow:hover { background: #322a55; }
  .vrow.sel { background: #3d3560; }
  .ev { padding: 2px 4px; border-radius: 4px; cursor: pointer; }
  .ev:hover { background: #322a55; }
  .ev.lost { color: #ff9a9a; }
  .ev.gained { color: #8ae09a; }
  .ev.past { background: #2c2650; }
  .log { max-height: 160px; overflow-y: auto; }
  #tl { width: 100%; }
</style>
</head>
<body>
  <canvas id="cv" width="1100" height="640"></canvas>
  <div id="side"></div>
  <script type="module" src="dist/src/main.js"></script>
</body>
</html>
