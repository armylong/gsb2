<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>山馆升降台 · 画箱搬运谜题</title>
  </head>
  <body>
    <div id="app">
      <header class="topbar">
        <div class="title">
          <h1>山馆升降台</h1>
          <span id="level-name" class="level-name"></span>
        </div>
        <div class="hud">
          <div class="hud-item">回合 <b id="hud-turn">0</b> / <span id="hud-budget">0</span></div>
          <div class="hud-item">剩余回合 <b id="hud-remaining">0</b></div>
          <div class="hud-item">已入柜 <b id="hud-delivered">0</b> / <span id="hud-total">0</span></div>
          <div class="hud-item" id="hud-alt"></div>
        </div>
      </header>
      <main class="layout">
        <section class="stage-wrap">
          <canvas id="stage" width="1040" height="600"></canvas>
          <div id="toast" class="toast" hidden></div>
          <div id="win-banner" class="win-banner" hidden>
            <div class="win-card">
              <h2>全部入柜，通关！</h2>
              <p id="win-detail"></p>
              <button id="win-replay" class="btn">回看本局路线</button>
            </div>
          </div>
        </section>
        <aside class="panel">
          <div class="panel-block">
            <h3>楼层调度</h3>
            <div id="floor-buttons" class="floor-buttons"></div>
            <button id="btn-wait" class="btn wide"></button>
          </div>
          <div class="panel-block">
            <h3>当前选择</h3>
            <p id="selection-info" class="hint">点击场景中的画箱选中，再点击目标货位 / 门侧。</p>
            <div id="dest-hints"></div>
          </div>
          <div class="panel-block">
            <h3>本局控制</h3>
            <div class="btn-row">
              <button id="btn-undo" class="btn">撤销</button>
              <button id="btn-reset" class="btn">重置本关</button>
            </div>
            <div class="btn-row">
              <button id="btn-level1" class="btn">第 1 关</button>
              <button id="btn-level2" class="btn">第 2 关</button>
            </div>
          </div>
          <div class="panel-block">
            <h3>回看：楼层与放货顺序</h3>
            <div id="review" class="review"></div>
          </div>
          <div class="panel-block rules">
            <h3>结算规则（固定顺序，与动画速度无关）</h3>
            <ol>
              <li>判定当前回合哪侧门开</li>
              <li>校验通道 / 过梁 / 货位</li>
              <li>搬箱落位，回合数 +1</li>
              <li>交替门按新回合切换</li>
            </ol>
            <p class="hint">暂存位只算试摆，不计入已搬运；只有画箱真正进入对应展柜才算。</p>
          </div>
        </aside>
      </main>
    </div>
    <script type="module" src="/src/ui/main.ts"></script>
  </body>
</html>
