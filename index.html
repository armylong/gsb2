<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>纸偶动作重定向观察页</title>
    <link rel="stylesheet" href="/src/ui/style.css" />
  </head>
  <body>
    <div id="app">
      <header>
        <h1>纸偶动作重定向</h1>
        <span class="hint">拖动画面旋转视角 · 点击关节球选中检视</span>
      </header>
      <main>
        <div id="viewer"></div>
        <aside id="panel">
          <section class="card">
            <h2>片段与播放</h2>
            <label class="row">
              动作片段
              <select id="clip-select"></select>
            </label>
            <div class="row">
              <button id="play-btn">播放</button>
              <button id="rest-btn">显示静止姿势</button>
            </div>
            <label class="row column">
              时间
              <input id="time-slider" type="range" min="0" max="1" step="0.001" value="0" />
            </label>
            <div class="row">
              <span id="time-label">t = 0.00 s</span>
              <span id="duration-label"></span>
            </div>
            <div class="row" id="pose-toggles">
              <label><input type="checkbox" id="src-rest-toggle" /> 源只看静止</label>
              <label><input type="checkbox" id="tgt-rest-toggle" /> 目标只看静止</label>
            </div>
          </section>

          <section class="card">
            <h2>根移动方式</h2>
            <label class="row">
              <input type="radio" name="root-mode" value="height" checked />
              按身高换算（源/目标 1 : 1.5）
            </label>
            <label class="row">
              <input type="radio" name="root-mode" value="keep" />
              保持原位
            </label>
            <label class="row">
              <input type="checkbox" id="trail-toggle" checked />
              显示目标根移动轨迹
            </label>
          </section>

          <section class="card">
            <h2>关节对应关系</h2>
            <div id="mapping-issues" class="issues"></div>
            <div class="mapping-head row">
              <span>源关节</span><span>目标关节</span>
            </div>
            <div id="mapping-list"></div>
            <div class="row">
              <button id="mapping-reset-btn">恢复默认对应</button>
              <button id="mapping-save-btn">保存对应文件</button>
              <button id="mapping-load-btn">载入对应文件</button>
              <input id="mapping-file" type="file" accept=".json,application/json" hidden />
            </div>
          </section>

          <section class="card">
            <h2>关节检视</h2>
            <div id="inspect-content" class="inspect">未选中关节（点击场景中的关节球，或在下方选择）</div>
            <label class="row">
              检视关节
              <select id="inspect-select"></select>
            </label>
          </section>

          <section class="card">
            <h2>动作数据</h2>
            <div class="row">
              <button id="export-btn">导出目标动作 JSON</button>
              <button id="motion-load-btn">载入动作 JSON</button>
              <input id="motion-file" type="file" accept=".json,application/json" hidden />
            </div>
            <div id="motion-status" class="hint"></div>
          </section>
        </aside>
      </main>
    </div>
    <script type="module" src="/src/ui/main.ts"></script>
  </body>
</html>
