<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>二维刚体关节链试验台</title>
    <link rel="stylesheet" href="/src/styles.css" />
  </head>
  <body>
    <div class="layout">
      <aside class="panel">
        <h1>关节链试验台</h1>
        <p class="sub">Planck.js（Box2D）· 固定步长 · 真实约束求解</p>

        <section>
          <h2>样例</h2>
          <select id="scenario-select">
            <option value="short">短摆链（4 节）</option>
            <option value="long">长链（10 节）</option>
            <option value="weighted">带重物链（6 节 + 重物）</option>
          </select>
        </section>

        <section>
          <h2>播放控制</h2>
          <div class="btn-row">
            <button id="btn-run" class="active">▶ 运行</button>
            <button id="btn-pause">⏸ 暂停</button>
            <button id="btn-step">⏭ 单步</button>
            <button id="btn-reset">↺ 重置</button>
          </div>
          <div class="btn-row">
            <span class="group-label">慢放</span>
            <button data-speed="1" id="speed-1" class="active">1×</button>
            <button data-speed="0.5" id="speed-05">0.5×</button>
            <button data-speed="0.25" id="speed-025">0.25×</button>
          </div>
          <div class="btn-row">
            <span class="group-label">显示节奏</span>
            <button id="rate-60" class="active">60 Hz</button>
            <button id="rate-30">30 Hz</button>
          </div>
        </section>

        <section>
          <h2>物理参数</h2>
          <label class="slider-row">
            <span>重力 <em id="gravity-val"></em></span>
            <input id="gravity" type="range" />
          </label>
          <label class="slider-row">
            <span>关节转动范围 <em id="limit-angle-val"></em></span>
            <input id="limit-angle" type="range" />
          </label>
          <label class="check-row">
            <input id="limit-enabled" type="checkbox" />
            <span>启用角度限制</span>
          </label>
          <label class="slider-row" id="weight-row">
            <span>重物质量 <em id="weight-mass-val"></em></span>
            <input id="weight-mass" type="range" disabled />
          </label>
          <label class="check-row">
            <input id="adjacent-filter" type="checkbox" />
            <span>排除相邻链节碰撞（统一规则）</span>
          </label>
        </section>

        <section>
          <h2>关节拆装（暂停时）</h2>
          <select id="joint-select"></select>
          <div class="btn-row">
            <button id="btn-break" class="danger">拆开</button>
            <button id="btn-restore" class="ok">恢复</button>
          </div>
          <p class="hint">恢复要求两端连接点距离 ≤ 0.25 m，过远将拒绝且不瞬移。</p>
        </section>

        <section>
          <h2>选中关节读数</h2>
          <dl class="readout">
            <dt>状态</dt><dd id="hud-status" class="status ok">—</dd>
            <dt>当前角度</dt><dd id="hud-angle">—</dd>
            <dt>有效范围</dt><dd id="hud-limit">—</dd>
            <dt>连接点偏差</dt><dd id="hud-deviation">—</dd>
            <dt>模拟时间</dt><dd id="hud-simtime">—</dd>
            <dt>累计步数</dt><dd id="hud-steps">—</dd>
          </dl>
        </section>
      </aside>

      <main class="stage">
        <canvas id="scene"></canvas>
        <div class="overlay-tip">
          按住链节/重物拖动 = 临时力约束（松手即释放，暂停时拖动会按单步施力）· 点击关节圆点 J# 可选中
        </div>
        <div id="toast" class="toast"></div>
      </main>
    </div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
