<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>群岛潮汐传送 · 短题</title>
  <style>
    :root {
      --bg: #0a1826;
      --panel: #12283d;
      --panel-2: #0e2133;
      --line: #24445f;
      --text: #eef3f8;
      --dim: #93a7ba;
      --tide: #4fb0e8;
      --ebb: #a986e8;
      --gold: #ffd34d;
      --danger: #ff7b7b;
      --ok: #7ee6a4;
    }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      background: var(--bg);
      color: var(--text);
      font-family: "PingFang SC", "Hiragino Sans GB", "Microsoft YaHei", system-ui, sans-serif;
      display: flex;
      min-height: 100vh;
    }
    #stage {
      flex: 1 1 auto;
      padding: 14px;
      min-width: 0;
    }
    #map {
      width: 100%;
      max-width: 1150px;
      height: auto;
      border: 1px solid var(--line);
      border-radius: 10px;
      background: #0e2740;
      display: block;
    }
    #side {
      flex: 0 0 380px;
      padding: 14px 16px;
      background: var(--panel);
      border-left: 1px solid var(--line);
      display: flex;
      flex-direction: column;
      gap: 12px;
      overflow-y: auto;
      max-height: 100vh;
    }
    h1 { font-size: 18px; margin: 0; }
    h2 { font-size: 14px; margin: 0 0 6px; color: var(--dim); font-weight: 600; }
    .box {
      background: var(--panel-2);
      border: 1px solid var(--line);
      border-radius: 8px;
      padding: 10px 12px;
    }
    #puzzle-brief { font-size: 12.5px; color: var(--dim); line-height: 1.6; margin-top: 6px; }
    #state-line { font-size: 13.5px; line-height: 1.7; }
    .badge {
      display: inline-block;
      padding: 1px 8px;
      border-radius: 10px;
      font-size: 12px;
      font-weight: 700;
      color: #08141f;
    }
    .badge.tide { background: var(--tide); }
    .badge.ebb { background: var(--ebb); color: #1c1230; }
    button {
      font-family: inherit;
      font-size: 13px;
      color: var(--text);
      background: #1d3d59;
      border: 1px solid var(--line);
      border-radius: 6px;
      padding: 7px 10px;
      cursor: pointer;
    }
    button:hover { background: #275073; }
    .puzzle-row { display: flex; gap: 8px; flex-wrap: wrap; }
    .puzzle-row button.active {
      background: #2f6b46;
      border-color: var(--ok);
    }
    .tool-row { display: flex; gap: 8px; flex-wrap: wrap; }
    #clock-box { display: none; gap: 8px; align-items: center; font-size: 13px; flex-wrap: wrap; }
    .side-btn { font-weight: 700; }
    .side-btn.tide { background: #16415c; }
    .side-btn.ebb { background: #352753; }
    .side-btn.cur { outline: 2px solid var(--gold); }
    .medal { color: var(--dim); font-size: 13px; }
    .medal.taken { color: var(--gold); font-weight: 700; }
    #transit-card { font-size: 12.5px; line-height: 1.75; }
    .card-title { color: var(--dim); font-size: 12px; margin-bottom: 4px; }
    .arrow { color: var(--gold); font-weight: 700; }
    .muted { color: var(--dim); font-size: 12px; }
    #analysis { font-size: 12.5px; line-height: 1.7; min-height: 34px; }
    #log {
      flex: 1 1 auto;
      min-height: 150px;
      max-height: 260px;
      overflow-y: auto;
      font-size: 12px;
      line-height: 1.65;
      background: #0a1b2b;
      border-radius: 6px;
      padding: 8px 10px;
    }
    #hint { font-size: 11.5px; color: var(--dim); line-height: 1.6; }
    .banner {
      position: fixed;
      top: 18px;
      left: 50%;
      transform: translateX(-50%) translateY(-80px);
      padding: 12px 26px;
      border-radius: 10px;
      font-weight: 700;
      font-size: 15px;
      transition: transform .35s ease;
      z-index: 10;
      max-width: 70vw;
      text-align: center;
    }
    .banner.show { transform: translateX(-50%) translateY(0); }
    .banner.win { background: #2c5e3f; border: 1px solid var(--ok); }
    .banner.trap { background: #5e2c2c; border: 1px solid var(--danger); }
    .legend { display: flex; flex-wrap: wrap; gap: 10px; font-size: 11.5px; color: var(--dim); margin-top: 8px; }
    .legend span::before {
      content: "";
      display: inline-block;
      width: 10px; height: 10px;
      border-radius: 2px;
      margin-right: 4px;
      vertical-align: -1px;
    }
    .lg-seal::before { background: var(--danger); }
    .lg-one::before { background: #e8a33d; }
    .lg-reach::before { background: var(--ok); }
    .lg-trap::before { background: var(--danger); border-radius: 50%; }
  </style>
</head>
<body>
  <div id="stage">
    <canvas id="map"></canvas>
    <div class="legend">
      <span class="lg-seal">红色交叉 = 封死的门背面（不可进）</span>
      <span class="lg-one">橙色三角 = 只许出去的单向门</span>
      <span class="lg-reach">绿色光圈 = 当前状态可达</span>
      <span class="lg-trap">红色虚线圈 = 可达但回不到起点</span>
    </div>
  </div>

  <div id="side">
    <div>
      <h1>群岛潮汐传送</h1>
      <h2 style="margin-top:8px">选择题面</h2>
      <div class="puzzle-row">
        <button data-puzzle="P1" class="active">题面一 · 两次翻卡</button>
        <button data-puzzle="P2">题面二 · 单向死胡同</button>
      </div>
      <div class="box" style="margin-top:10px">
        <div id="puzzle-title" style="font-weight:700"></div>
        <div id="puzzle-brief"></div>
      </div>
    </div>

    <div class="box">
      <h2>当前状态</h2>
      <div id="state-line"></div>
      <div id="clock-box" class="box" style="margin-top:8px; background:#0d2438"></div>
      <div id="medal-box" class="medal" style="margin-top:8px"></div>
    </div>

    <div class="box">
      <h2>分析（不参考人物走过的路径，每次从当前状态重新算）</h2>
      <div class="tool-row">
        <button id="btn-reach">查看可达区域</button>
        <button id="btn-trap">找“回不去”的目标</button>
        <button id="btn-flipinfo">最短翻卡路线</button>
        <button id="btn-reset">重来 (R)</button>
      </div>
      <div id="analysis" style="margin-top:8px"></div>
    </div>

    <div class="box">
      <h2>过门核对</h2>
      <div id="transit-card">
        <div class="card-title">过门核对</div>
        <div class="muted">尚未通过任何门</div>
      </div>
    </div>

    <div class="box" style="display:flex; flex-direction:column; flex:1">
      <h2>行动日志</h2>
      <div id="log"></div>
    </div>

    <div id="hint"></div>
  </div>

  <div id="banner" class="banner"></div>

  <script type="module" src="dist/main.js"></script>
</body>
</html>
