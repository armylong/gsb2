<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>光照探针过渡检查</title>
    <style>
      * { box-sizing: border-box; }
      body {
        margin: 0;
        font: 13px/1.5 -apple-system, "PingFang SC", "Microsoft YaHei", sans-serif;
        background: #14151a;
        color: #d8dae0;
      }
      #app { display: flex; height: 100vh; }
      #view { flex: 1; position: relative; min-width: 0; }
      #view canvas { display: block; }
      #panel {
        width: 340px;
        padding: 14px;
        overflow-y: auto;
        background: #1d1f26;
        border-left: 1px solid #2c2f38;
      }
      h1 { font-size: 15px; margin: 0 0 10px; }
      h2 { font-size: 12px; margin: 16px 0 6px; color: #9aa0ae; text-transform: uppercase; }
      .row { display: flex; gap: 6px; margin: 6px 0; flex-wrap: wrap; align-items: center; }
      button {
        background: #2c303c; color: #d8dae0; border: 1px solid #3a3f4d;
        border-radius: 5px; padding: 5px 10px; cursor: pointer; font-size: 12px;
      }
      button.active { background: #3d6bfe; border-color: #3d6bfe; color: #fff; }
      button:hover { filter: brightness(1.15); }
      .probe {
        border: 1px solid #333744; border-radius: 6px; padding: 8px; margin: 8px 0;
        background: #22242d;
      }
      .probe.disabled { opacity: 0.55; }
      .probe-head { display: flex; align-items: center; gap: 8px; }
      .probe-head b { flex: 1; font-weight: 600; }
      .weightbar {
        height: 8px; background: #101218; border-radius: 4px; margin: 6px 0;
        overflow: hidden;
      }
      .weightbar > div { height: 100%; background: #3d6bfe; width: 0%; transition: width 60ms; }
      .dirs { display: grid; grid-template-columns: repeat(6, 1fr); gap: 4px; }
      .dirs label { display: flex; flex-direction: column; align-items: center; font-size: 10px; color: #9aa0ae; }
      .dirs input[type="color"] {
        width: 100%; height: 22px; border: none; padding: 0; background: none; cursor: pointer;
      }
      #swatch {
        width: 34px; height: 34px; border-radius: 6px; border: 1px solid #3a3f4d;
        display: inline-block; vertical-align: middle;
      }
      #explain {
        background: #181a20; border-left: 3px solid #3d6bfe; padding: 8px 10px;
        border-radius: 4px; color: #b9c0cf; min-height: 60px; white-space: pre-line;
      }
      input[type="range"] { width: 100%; }
      .mono { font-family: ui-monospace, Menlo, monospace; font-size: 11px; }
      .kv { display: flex; justify-content: space-between; gap: 8px; }
    </style>
  </head>
  <body>
    <div id="app">
      <div id="view"></div>
      <div id="panel">
        <h1>光照探针过渡检查</h1>

        <h2>采样模式</h2>
        <div class="row">
          <button id="mode-blend" class="active">插值混合</button>
          <button id="mode-nearest">最近探针 (对照)</button>
        </div>

        <h2>预设场景</h2>
        <div class="row">
          <button id="preset-warmcool">冷暖分界</button>
          <button id="preset-missing">探针缺失</button>
        </div>

        <h2>球体运动</h2>
        <div class="row">
          <label><input type="checkbox" id="auto" checked /> 自动往返</label>
        </div>
        <input type="range" id="pos" min="0" max="1000" value="150" />

        <h2>探针</h2>
        <div id="probes"></div>

        <h2>当前采样 (球心, 法线 +Y)</h2>
        <div class="row">
          <span id="swatch"></span>
          <div style="flex:1">
            <div class="kv"><span>来源</span><b id="source" class="mono"></b></div>
            <div class="kv"><span>覆盖度</span><b id="coverage" class="mono"></b></div>
            <div class="kv"><span>颜色 (线性)</span><b id="colorhex" class="mono"></b></div>
          </div>
        </div>

        <h2>说明</h2>
        <div id="explain"></div>
      </div>
    </div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
