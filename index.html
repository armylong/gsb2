<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>相邻曲面细分裂缝观察台</title>
  </head>
  <body>
    <div id="app">
      <div id="canvas-host"></div>
      <div class="view-label" id="label-left">直接拼接（有裂缝）</div>
      <div class="view-label" id="label-right">接缝修正（密侧吸附到疏侧折线）</div>

      <aside id="panel">
        <h1>细分裂缝观察台</h1>
        <p class="hint">
          两块双三次 Bézier 曲面共享一条边。边曲线数学上重合，但各自离散为分段
          折线后，弦逼近误差随密度不同而不同 → 裂缝。
        </p>

        <section>
          <h2>显示</h2>
          <label class="row"><input type="checkbox" id="wireframe" checked /> 线框叠加</label>
          <label class="row"><input type="checkbox" id="showPoints" checked /> 显示控制点</label>
          <label class="row"><input type="checkbox" id="splitView" checked /> 左右对比（关闭则只看直接拼接）</label>
        </section>

        <section>
          <h2>Patch A（暖色，疏侧）</h2>
          <label class="row">沿边分段 <span id="va-val">4</span>
            <input type="range" id="subdivVA" min="1" max="32" step="1" value="4" />
          </label>
          <label class="row">横向分段 <span id="ua-val">12</span>
            <input type="range" id="subdivUA" min="1" max="32" step="1" value="12" />
          </label>
          <label class="row"><input type="checkbox" id="reverseA" /> 反转边参数方向</label>
        </section>

        <section>
          <h2>Patch B（冷色，密侧）</h2>
          <label class="row">沿边分段 <span id="vb-val">16</span>
            <input type="range" id="subdivVB" min="1" max="32" step="1" value="16" />
          </label>
          <label class="row">横向分段 <span id="ub-val">12</span>
            <input type="range" id="subdivUB" min="1" max="32" step="1" value="12" />
          </label>
          <label class="row"><input type="checkbox" id="reverseB" /> 反转边参数方向</label>
        </section>

        <section>
          <h2>控制点编辑</h2>
          <label class="row">选择点
            <select id="pointSelect"></select>
          </label>
          <div class="xyz">
            <label>X <input type="number" id="cpX" step="0.1" /></label>
            <label>Y <input type="number" id="cpY" step="0.1" /></label>
            <label>Z <input type="number" id="cpZ" step="0.1" /></label>
          </div>
          <label class="row">拖拽模式
            <select id="dragMode">
              <option value="translate">平移</option>
              <option value="rotate">旋转（演示用）</option>
            </select>
          </label>
          <button id="resetBtn" type="button">重置样例</button>
        </section>

        <section>
          <h2>观察距离与缝差</h2>
          <label class="row">相机距离 <span id="dist-val">13.5</span>
            <input type="range" id="camDist" min="4" max="48" step="0.5" value="13.5" />
          </label>
          <div id="metrics"></div>
        </section>
      </aside>
    </div>
    <script type="module" src="/src/main.ts"></script>
  </body>
  <style>
    :root {
      --bg: #14161a;
      --panel: #1d2128;
      --line: #2c323c;
      --text: #d8dde6;
      --muted: #8a93a2;
      --warm: #e0884a;
      --cool: #4a90e0;
      --good: #5fd08a;
      --bad: #ff6b6b;
    }
    * { box-sizing: border-box; }
    html, body { margin: 0; height: 100%; background: var(--bg); color: var(--text);
      font: 13px/1.5 -apple-system, "PingFang SC", "Helvetica Neue", sans-serif; }
    #app { display: flex; height: 100vh; }
    #canvas-host { flex: 1; position: relative; min-width: 0; }
    #canvas-host canvas { display: block; }
    .view-label {
      position: absolute; top: 12px; z-index: 5; pointer-events: none;
      background: rgba(20, 22, 26, 0.78); border: 1px solid var(--line);
      padding: 4px 10px; border-radius: 6px; font-size: 12px; color: var(--muted);
    }
    #label-left { left: 12px; }
    #label-right { left: 50%; margin-left: 12px; display: none; }
    body.split #label-right { display: block; }
    #panel {
      width: 320px; overflow-y: auto; background: var(--panel);
      border-left: 1px solid var(--line); padding: 16px; flex-shrink: 0;
    }
    h1 { font-size: 15px; margin: 0 0 8px; }
    h2 { font-size: 12px; color: var(--muted); text-transform: uppercase;
      letter-spacing: 0.08em; margin: 18px 0 8px; }
    .hint { color: var(--muted); font-size: 12px; margin: 0 0 8px; }
    section { border-top: 1px solid var(--line); padding-top: 4px; }
    section:first-of-type { border-top: none; }
    .row { display: flex; align-items: center; gap: 8px; margin: 8px 0; flex-wrap: wrap; }
    .row input[type="range"] { flex: 1; min-width: 120px; }
    .row span { min-width: 28px; text-align: right; color: var(--muted); }
    select, input[type="number"], button {
      background: #252a33; color: var(--text); border: 1px solid var(--line);
      border-radius: 5px; padding: 4px 6px; font-size: 12px;
    }
    select { flex: 1; }
    .xyz { display: flex; gap: 6px; margin: 8px 0; }
    .xyz label { flex: 1; display: flex; flex-direction: column; font-size: 11px; color: var(--muted); }
    .xyz input { width: 100%; }
    button { cursor: pointer; width: 100%; margin-top: 6px; }
    button:hover { border-color: var(--cool); }
    #metrics {
      font-family: ui-monospace, "SF Mono", Menlo, monospace; font-size: 11.5px;
      background: #14171c; border: 1px solid var(--line); border-radius: 6px;
      padding: 10px; white-space: pre-wrap; line-height: 1.7;
    }
    .bad { color: var(--bad); font-weight: 600; }
    .good { color: var(--good); font-weight: 600; }
  </style>
</html>
