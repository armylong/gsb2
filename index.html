<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>隐藏线出图工具 (HLR)</title>
  <style>
    :root {
      --border: #d6dbe3;
      --panel: #f7f9fc;
      --accent: #1f6feb;
      --text: #1c2430;
    }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      font: 13px/1.5 -apple-system, "PingFang SC", "Microsoft YaHei", sans-serif;
      color: var(--text);
      background: #eef1f6;
    }
    header {
      padding: 10px 16px;
      background: #fff;
      border-bottom: 1px solid var(--border);
    }
    header h1 { margin: 0 0 4px; font-size: 16px; }
    header p { margin: 0; color: #5a6675; font-size: 12px; }
    .toolbar {
      display: flex;
      flex-wrap: wrap;
      gap: 8px;
      align-items: center;
      padding: 8px 16px;
      background: var(--panel);
      border-bottom: 1px solid var(--border);
    }
    .toolbar button {
      padding: 5px 12px;
      border: 1px solid var(--border);
      border-radius: 6px;
      background: #fff;
      cursor: pointer;
      font-size: 12px;
    }
    .toolbar button:hover { border-color: var(--accent); color: var(--accent); }
    .toolbar .group-label { color: #5a6675; margin-left: 6px; }
    .toolbar input[type="range"] { vertical-align: middle; width: 130px; }
    .layout {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 12px;
      padding: 12px 16px;
    }
    .pane {
      background: #fff;
      border: 1px solid var(--border);
      border-radius: 8px;
      overflow: hidden;
      display: flex;
      flex-direction: column;
    }
    .pane h2 {
      margin: 0;
      padding: 8px 12px;
      font-size: 13px;
      background: var(--panel);
      border-bottom: 1px solid var(--border);
    }
    #view3d, #drawing { flex: 1; min-height: 620px; position: relative; }
    #drawing svg { display: block; margin: 0 auto; }
    .footer {
      padding: 8px 16px 16px;
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 12px;
    }
    .card {
      background: #fff;
      border: 1px solid var(--border);
      border-radius: 8px;
      padding: 10px 12px;
      font-size: 12px;
    }
    .card b { color: #33404f; }
    #stats { color: #5a6675; }
    #ioStatus { color: #1f6feb; margin-top: 4px; }
    input[type="file"] { display: none; }
  </style>
</head>
<body>
  <header>
    <h1>隐藏线出图工具 — 正交三视图 / 隐藏虚线 / SVG 往返检查</h1>
    <p>程序生成的三个不透明零件：开孔底板、只挡住长边中部的前景块、旋转小方块。点击右侧图纸线段可在左侧三维窗联动高亮。</p>
  </header>

  <div class="toolbar">
    <span class="group-label">视图：</span>
    <button id="btnFront">正视</button>
    <button id="btnTop">俯视</button>
    <button id="btnIso">斜视(等轴)</button>
    <button id="btnSync" title="按左侧三维窗当前相机姿态重算图纸">同步3D视角</button>

    <span class="group-label">折边阈值：</span>
    <input id="threshold" type="range" min="0" max="80" step="1" value="1" />
    <span id="thresholdValue">1°</span>

    <label class="group-label">
      <input id="chkHidden" type="checkbox" checked /> 显示遮挡虚线
    </label>

    <span class="group-label">文件：</span>
    <button id="btnExport">导出 SVG</button>
    <button id="btnImport">重开 SVG</button>
    <input id="fileInput" type="file" accept=".svg,image/svg+xml" />
    <button id="btnClearPick">清除点选</button>
  </div>

  <div class="layout">
    <div class="pane">
      <h2>三维窗口（可旋转/缩放，OrbitControls）</h2>
      <div id="view3d"></div>
    </div>
    <div class="pane">
      <h2>二维简图（SVG，点选线段联动三维）</h2>
      <div id="drawing"></div>
    </div>
  </div>

  <div class="footer">
    <div class="card">
      <b>点选信息</b>
      <div id="pickInfo">点击图纸上的线段查看对应三维边与遮挡零件</div>
    </div>
    <div class="card">
      <b>状态</b>
      <div id="stats"></div>
      <div id="ioStatus"></div>
    </div>
  </div>

  <script type="module" src="/src/main.ts"></script>
</body>
</html>
