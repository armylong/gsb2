<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>山坡材质规则检查器</title>
    <style>
      html, body { margin: 0; height: 100%; overflow: hidden; background: #101418; }
      #app { width: 100%; height: 100%; }
      #hud {
        position: fixed; top: 12px; left: 12px; z-index: 10;
        background: rgba(16, 20, 24, 0.88); color: #dfe6ee;
        font: 12px/1.5 ui-monospace, Menlo, Consolas, monospace;
        padding: 10px 12px; border-radius: 8px; border: 1px solid #2a3340;
        min-width: 300px; pointer-events: none; white-space: pre;
      }
      #hud .bar { display: flex; height: 10px; border-radius: 4px; overflow: hidden; margin: 6px 0 2px; }
      #hud .bar > div { height: 100%; }
      #hud .fallback { color: #ff5cf0; font-weight: bold; }
      #legend {
        position: fixed; bottom: 12px; left: 12px; z-index: 10;
        background: rgba(16, 20, 24, 0.88); color: #dfe6ee;
        font: 12px/1.6 ui-monospace, Menlo, Consolas, monospace;
        padding: 8px 12px; border-radius: 8px; border: 1px solid #2a3340;
        pointer-events: none; display: none;
      }
      .lil-gui { --background-color: rgba(16,20,24,0.92); }
    </style>
  </head>
  <body>
    <div id="app"></div>
    <div id="hud">点击地形拾取检查点…</div>
    <div id="legend"></div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
