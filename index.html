<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>三维曲线管道生成器</title>
  <style>
    * { box-sizing: border-box; }
    html, body { margin: 0; height: 100%; font-family: -apple-system, "PingFang SC", "Microsoft YaHei", sans-serif; font-size: 13px; }
    #app { display: flex; height: 100vh; }
    #panel {
      width: 360px; min-width: 360px; height: 100%; overflow-y: auto;
      background: #1e2126; color: #d7dce2; padding: 10px 12px 40px;
    }
    #viewport { flex: 1; position: relative; background: #14161a; }
    #viewport canvas { display: block; }
    h2 { font-size: 13px; margin: 14px 0 6px; color: #8ec6ff; border-bottom: 1px solid #333a44; padding-bottom: 4px; }
    h2:first-child { margin-top: 0; }
    .row { display: flex; align-items: center; gap: 6px; margin: 4px 0; flex-wrap: wrap; }
    .row label { flex: 0 0 96px; color: #9aa4b0; }
    .row input[type="number"] { width: 64px; }
    .row input[type="range"] { flex: 1; }
    input, select, button {
      background: #2a2f37; color: #d7dce2; border: 1px solid #3c434e;
      border-radius: 4px; padding: 3px 6px; font-size: 12px;
    }
    button { cursor: pointer; }
    button:hover { background: #353c46; }
    button.active { background: #2f5d8a; border-color: #4a86c5; }
    .pt-row { display: flex; gap: 4px; align-items: center; margin: 2px 0; }
    .pt-row .idx { width: 34px; color: #8ec6ff; cursor: pointer; }
    .pt-row .idx.sel { color: #ffb347; font-weight: bold; }
    .pt-row input { width: 58px; }
    .pt-row button { padding: 2px 6px; }
    #warnings { color: #ff8a80; white-space: pre-line; }
    #warnings:empty::after { content: "无警告"; color: #7bc47f; }
    table { border-collapse: collapse; width: 100%; margin-top: 4px; }
    th, td { border: 1px solid #3c434e; padding: 3px 5px; text-align: left; font-size: 11.5px; }
    th { background: #262b33; }
    td.pass { color: #7bc47f; } td.fail { color: #ff8a80; }
    #stats-line, #export-info { color: #9aa4b0; }
    .hint { color: #6b7480; font-size: 11px; }
  </style>
</head>
<body>
  <div id="app">
    <div id="panel"></div>
    <div id="viewport"></div>
  </div>
  <script type="module" src="/src/main.ts"></script>
</body>
</html>
