<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>粒子特效回放检查器</title>
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Ccircle cx='16' cy='16' r='6' fill='%235aa7ff'/%3E%3Ccircle cx='16' cy='16' r='12' fill='none' stroke='%235aa7ff' stroke-opacity='.45'/%3E%3C/svg%3E" />
  <link rel="stylesheet" href="src/styles.css" />
</head>
<body>
  <main class="app">
    <header class="app-header">
      <h1>单发射器粒子特效回放检查器</h1>
      <div class="mode-switch" role="group" aria-label="查看模式">
        <label><input type="radio" name="mode" value="A" checked /> 仅 A</label>
        <label><input type="radio" name="mode" value="B" /> 仅 B</label>
        <label><input type="radio" name="mode" value="split" /> 并排比较</label>
      </div>
    </header>

    <section class="stats-bar" aria-live="polite">
      <div class="stat"><span class="stat-label">播放时间</span><span id="stat-time" class="stat-value">0.000 s</span></div>
      <div class="stat"><span class="stat-label">A 粒子数</span><span id="stat-count-a" class="stat-value">0 / 400</span></div>
      <div class="stat stat-b"><span class="stat-label">B 粒子数</span><span id="stat-count-b" class="stat-value">0 / 400</span></div>
      <div class="stat stat-wide"><span class="stat-label">状态</span><span id="stat-state" class="stat-value">已暂停</span></div>
    </section>

    <section class="viewport" id="viewport">
      <div class="canvas-slot" id="slot-a">
        <canvas id="canvas-a"></canvas>
        <span class="canvas-tag">参数组 A</span>
      </div>
      <div class="canvas-slot" id="slot-b">
        <canvas id="canvas-b"></canvas>
        <span class="canvas-tag">参数组 B</span>
      </div>
    </section>

    <section class="transport">
      <div class="transport-buttons">
        <button id="btn-restart" type="button" title="回到开始（Home）">⏮ 回到开始</button>
        <button id="btn-play" type="button" title="播放/暂停（空格）">▶ 播放</button>
        <button id="btn-step" type="button" title="单步前进 1/60 秒（→）">⏭ 单步</button>
      </div>
      <div class="seek-row">
        <label for="seek">跳转时间</label>
        <input id="seek" type="range" min="0" max="60" step="0.01" value="0" />
        <input id="seek-number" type="number" min="0" max="60" step="0.01" value="0" aria-label="跳转时间（秒）" />
        <span class="unit">秒</span>
      </div>
    </section>

    <section class="panels">
      <div class="panel" id="panel-a">
        <div class="panel-header">
          <h2>参数组 A</h2>
          <button class="btn-reset" data-side="A" type="button">重置为默认</button>
        </div>
        <div class="sliders" id="sliders-a"></div>
        <pre class="param-summary" id="summary-a"></pre>
      </div>
      <div class="panel" id="panel-b">
        <div class="panel-header">
          <h2>参数组 B</h2>
          <button class="btn-reset" data-side="B" type="button">重置为默认</button>
        </div>
        <div class="sliders" id="sliders-b"></div>
        <pre class="param-summary" id="summary-b"></pre>
      </div>
    </section>

    <footer class="app-footer">
      <p>快捷键：空格 播放/暂停 · → 单步前进 · Home 回到开始。固定 1/120 s 仿真步长 + 种子随机，同参数同时间结果一致。</p>
    </footer>
  </main>

  <script type="module" src="src/main.js"></script>
</body>
</html>
