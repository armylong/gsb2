<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>门洞空间演示 · Portal Demo</title>
  <style>
    html, body { margin: 0; height: 100%; overflow: hidden; background: #101418; }
    canvas { display: block; }
    .panel {
      position: absolute; top: 12px; z-index: 10;
      background: rgba(10, 14, 18, 0.85); color: #cfe3ff;
      font: 12px/1.5 "SF Mono", Menlo, Consolas, monospace;
      padding: 10px 12px; border-radius: 8px; border: 1px solid #2a3644;
      user-select: none;
    }
    #panel-left { left: 12px; width: 250px; }
    #panel-right { right: 12px; width: 400px; max-height: calc(100% - 24px); overflow: auto; }
    .title { font-size: 14px; font-weight: bold; color: #fff; margin-bottom: 6px; }
    .row { margin: 6px 0; display: flex; align-items: center; gap: 6px; }
    button {
      background: #1d2836; color: #cfe3ff; border: 1px solid #3a4c60;
      border-radius: 5px; padding: 3px 10px; cursor: pointer; font: inherit;
    }
    button:hover { background: #2a3a4e; }
    button.sel { background: #2f5f8f; border-color: #5f9fdf; color: #fff; }
    input[type="range"] { flex: 1; }
    label { display: flex; align-items: center; gap: 6px; width: 100%; }
    label span { min-width: 48px; text-align: right; color: #9fd0ff; }
    .hint { margin-top: 8px; color: #8fa8c0; font-size: 11px; }
    #debug { margin: 0; white-space: pre-wrap; word-break: break-all; }
    #hint {
      position: absolute; bottom: 12px; left: 50%; transform: translateX(-50%);
      z-index: 10; color: #9fb8d0; background: rgba(10, 14, 18, 0.7);
      padding: 4px 14px; border-radius: 6px; font: 12px/1.4 monospace;
      pointer-events: none;
    }
  </style>
</head>
<body>
  <div id="panel-left" class="panel"></div>
  <div id="panel-right" class="panel"><pre id="debug"></pre></div>
  <div id="hint">点击画面锁定鼠标 · WASD 移动 · Shift 加速 · 鼠标观察 · Esc 释放鼠标</div>
  <script type="module" src="/src/main.ts"></script>
</body>
</html>
