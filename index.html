<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>传送带编号贴合试验</title>
    <link rel="stylesheet" href="/src/style.css" />
  </head>
  <body>
    <div id="app">
      <aside id="panel">
        <h1>传送带编号贴合试验</h1>

        <section>
          <h2>内置摆位</h2>
          <div id="presets" class="preset-grid"></div>
        </section>

        <section>
          <h2>中间轮（轮 1）</h2>
          <label class="slider-row">
            <span>X <em id="v-mx">0.00</em></span>
            <input id="mx" type="range" min="-6" max="6" step="0.05" value="0" />
          </label>
          <label class="slider-row">
            <span>Y <em id="v-my">2.40</em></span>
            <input id="my" type="range" min="-4" max="5" step="0.05" value="2.4" />
          </label>
          <label class="slider-row">
            <span>半径 <em id="v-mr">0.90</em></span>
            <input id="mr" type="range" min="0.3" max="2.4" step="0.02" value="0.9" />
          </label>
          <div class="fixed-note">轮 0 固定 (-4, 0) r=1.20，轮 2 固定 (4, 0) r=1.50</div>
        </section>

        <section>
          <h2>走带控制</h2>
          <div class="btn-row">
            <button id="play" class="primary">暂停</button>
            <button id="reverse">反转方向</button>
          </div>
          <div class="btn-row">
            <button id="step-back">单步 −</button>
            <button id="step-fwd">单步 +</button>
            <span class="step-note">每步 <em id="v-step">0.20</em> 带长单位</span>
          </div>
          <label class="slider-row">
            <span>带速 <em id="v-speed">1.20</em></span>
            <input id="speed" type="range" min="0" max="4" step="0.05" value="1.2" />
          </label>
          <label class="slider-row">
            <span>刻度间距 <em id="v-spacing">0.80</em></span>
            <input id="spacing" type="range" min="0.3" max="2" step="0.05" value="0.8" />
          </label>
        </section>

        <section>
          <h2>选中刻度</h2>
          <div class="btn-row">
            <select id="select-marker"></select>
            <button id="focus">镜头转过去</button>
          </div>
          <div class="readout">
            <div>到接缝沿带距离：<strong id="r-dist">—</strong></div>
            <div>走带偏移 phase：<strong id="r-phase">0.000</strong></div>
            <div>方向：<strong id="r-dir">正向（s 增大）</strong></div>
          </div>
          <div class="hint">也可直接点击 3D 场景里的数字徽章选择；空格暂停、R 反转、←/→ 单步</div>
        </section>

        <section>
          <h2>几何信息</h2>
          <div class="readout">
            <div>闭合带总长：<strong id="r-length">—</strong></div>
            <div id="r-contacts"></div>
          </div>
        </section>

        <section id="conflict-box" class="hidden">
          <h2>⚠ 无法形成有效带路</h2>
          <div id="conflict-list"></div>
          <div class="hint">画面保留上一次有效带路；红圈为当前失效位置，黄虚线为上次有效位置</div>
        </section>
      </aside>

      <main id="viewport"></main>
    </div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
