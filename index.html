<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>薄膜干涉 · 视角-颜色观察台</title>
  <style>
    :root { color-scheme: dark; }
    * { box-sizing: border-box; }
    body {
      margin: 0; font: 13px/1.5 "SF Pro Text", "PingFang SC", system-ui, sans-serif;
      background: #141518; color: #d8dade; display: flex; height: 100vh; overflow: hidden;
    }
    #viewport { flex: 1; position: relative; min-width: 0; }
    #viewport canvas { display: block; }
    #hint {
      position: absolute; left: 12px; bottom: 10px; color: #8a8f98; font-size: 12px;
      pointer-events: none; text-shadow: 0 1px 2px #000;
    }
    #panel {
      width: 340px; flex: none; overflow-y: auto; padding: 14px 16px 40px;
      background: #1b1d21; border-left: 1px solid #2c2f36;
    }
    h1 { font-size: 15px; margin: 2px 0 10px; }
    h2 {
      font-size: 12px; text-transform: uppercase; letter-spacing: .08em;
      color: #8a8f98; margin: 18px 0 8px; border-bottom: 1px solid #2c2f36; padding-bottom: 4px;
    }
    fieldset { border: 1px solid #2c2f36; border-radius: 8px; margin: 0 0 10px; padding: 8px 10px 10px; }
    legend { padding: 0 6px; color: #aab0ba; }
    label.row { display: flex; align-items: center; gap: 8px; margin: 6px 0; }
    label.row > span:first-child { flex: 0 0 92px; color: #aab0ba; }
    input[type=range] { flex: 1; accent-color: #6ea8fe; }
    output { flex: 0 0 64px; text-align: right; font-variant-numeric: tabular-nums; color: #e8eaee; }
    .checks { display: flex; gap: 14px; flex-wrap: wrap; margin: 4px 0; }
    .checks label { display: flex; gap: 5px; align-items: center; cursor: pointer; }
    button {
      background: #2a2e35; color: #d8dade; border: 1px solid #3a3f48; border-radius: 6px;
      padding: 5px 10px; cursor: pointer; font-size: 12px;
    }
    button:hover { background: #343945; }
    button.active { border-color: #6ea8fe; color: #9ec2ff; }
    .btnrow { display: flex; gap: 6px; flex-wrap: wrap; margin: 6px 0; }
    #readout { font-variant-numeric: tabular-nums; }
    #readout .empty { color: #6b7078; }
    #swatch {
      width: 100%; height: 34px; border-radius: 6px; border: 1px solid #3a3f48;
      margin: 6px 0; background: #000;
    }
    #spectrum { width: 100%; height: 56px; border-radius: 6px; border: 1px solid #3a3f48; display: block; }
    table.rvals { width: 100%; border-collapse: collapse; margin-top: 6px; }
    table.rvals td { padding: 2px 4px; text-align: right; }
    table.rvals td:first-child { text-align: left; color: #aab0ba; }
    .preset-item { display: flex; align-items: center; gap: 6px; margin: 4px 0; }
    .preset-item .name { flex: 1; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
    .preset-item button { padding: 3px 8px; }
    kbd { background:#2a2e35; border-radius:4px; padding:0 4px; font-size:11px; }
  </style>
</head>
<body>
  <div id="viewport">
    <div id="hint">拖拽旋转 · 滚轮缩放 · 点击样片表面取样读数</div>
  </div>
  <div id="panel">
    <h1>薄膜干涉 · 视角-颜色观察台</h1>
    <div id="sample-controls"></div>

    <h2>照明</h2>
    <fieldset>
      <label class="row"><span>方位角</span><input id="light-az" type="range" min="-180" max="180" step="1" value="35"><output id="light-az-v"></output></label>
      <label class="row"><span>仰角</span><input id="light-el" type="range" min="5" max="90" step="1" value="55"><output id="light-el-v"></output></label>
      <div class="checks">
        <label><input type="checkbox" id="light-fixed" checked> 固定照明（转相机时不动）</label>
      </div>
    </fieldset>

    <h2>表面取样</h2>
    <fieldset id="readout">
      <div class="empty">点击任一样片表面，读取该点的入射角、膜厚、分波长反射率与显示颜色。</div>
    </fieldset>

    <h2>对照预设</h2>
    <fieldset>
      <div class="btnrow" id="builtin-presets"></div>
      <div id="user-presets"></div>
      <div class="btnrow">
        <button id="save-preset">保存当前为预设</button>
        <button id="snapshot">导出快照 PNG</button>
      </div>
    </fieldset>
  </div>
  <script type="module" src="/src/main.ts"></script>
</body>
</html>
