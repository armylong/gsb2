<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<title>本地采集任务编排</title>
<style>
  * { box-sizing: border-box; }
  body { font-family: -apple-system, "PingFang SC", sans-serif; margin: 0; background: #f4f5f7; color: #222; }
  header { background: #2b3a4a; color: #fff; padding: 10px 20px; display: flex; align-items: baseline; gap: 16px; }
  header h1 { font-size: 17px; margin: 0; }
  header .meta { font-size: 12px; opacity: .85; }
  main { display: flex; gap: 12px; padding: 12px 20px; align-items: flex-start; }
  .col { min-width: 0; }
  #left { width: 420px; flex: none; }
  #right { flex: 1; }
  .card { background: #fff; border: 1px solid #ddd; border-radius: 6px; padding: 12px 14px; margin-bottom: 12px; }
  .card h2 { font-size: 14px; margin: 0 0 8px; }
  table { border-collapse: collapse; width: 100%; font-size: 13px; }
  th, td { text-align: left; padding: 5px 8px; border-bottom: 1px solid #eee; vertical-align: top; }
  th { color: #666; font-weight: 600; white-space: nowrap; }
  button { font-size: 12px; padding: 3px 10px; border: 1px solid #bbb; border-radius: 4px; background: #fff; cursor: pointer; }
  button:hover { background: #eef; }
  button:disabled { opacity: .4; cursor: default; }
  .tag { display: inline-block; padding: 1px 8px; border-radius: 10px; font-size: 12px; white-space: nowrap; }
  .st-running  { background: #e3f0ff; color: #1565c0; }
  .st-success  { background: #e2f5e9; color: #1b7f3b; }
  .st-failed   { background: #fde3e3; color: #c62828; }
  .st-blocked  { background: #fff3d6; color: #9a6a00; }
  .st-pending  { background: #eee; color: #666; }
  .st-skipped, .st-cancelled { background: #eee; color: #888; }
  .st-carried  { background: #e8e4f7; color: #5a4a9e; }
  .st-unknown, .st-interrupted { background: #ffe0e0; color: #a02020; }
  .st-timeout  { background: #fde3e3; color: #c62828; }
  .err { color: #c62828; font-size: 12px; white-space: pre-wrap; }
  .muted { color: #888; font-size: 12px; }
  .warn { background: #fff3d6; border: 1px solid #e0c060; border-radius: 4px; padding: 6px 10px; font-size: 12px; margin-bottom: 8px; }
  .runrow { cursor: pointer; }
  .runrow:hover { background: #f0f6ff; }
  .runrow.sel { background: #e3f0ff; }
  #logbox { background: #1d1f21; color: #d6d6d6; font-family: Menlo, monospace; font-size: 12px;
            padding: 10px; border-radius: 6px; height: 320px; overflow: auto; white-space: pre-wrap; word-break: break-all; }
  .flowtask { font-size: 12px; color: #555; }
  a.link { color: #1565c0; cursor: pointer; font-size: 12px; }
</style>
</head>
<body>
<header>
  <h1>本地采集任务编排</h1>
  <span class="meta" id="globalMeta">加载中…</span>
</header>
<main>
  <div class="col" id="left">
    <div class="card">
      <h2>流程(来自本地配置)</h2>
      <div id="flows"></div>
    </div>
    <div class="card">
      <h2>运行记录</h2>
      <div id="runs"></div>
    </div>
  </div>
  <div class="col" id="right">
    <div class="card" id="detailCard" style="display:none">
      <h2 id="detailTitle"></h2>
      <div id="detailWarn"></div>
      <div id="detailBody"></div>
    </div>
    <div class="card" id="logCard" style="display:none">
      <h2 id="logTitle">日志</h2>
      <div id="logbox"></div>
    </div>
  </div>
</main>
<script>
let selectedRun = null;
let logAttempt = null, logOffset = 0, logStatus = null;

const ST_LABEL = {
  pending:'等待', running:'运行中', success:'成功', failed:'失败', blocked:'被阻塞',
  skipped:'未执行', cancelled:'已取消', carried:'继承结果', unknown:'结果未知',
  timeout:'超时', interrupted:'服务中断', full:'全新', rerun:'节点重跑', recover:'崩溃恢复'
};
const tag = s => `<span class="tag st-${s}">${ST_LABEL[s]||s}</span>`;

async function api(path, method, body) {
  const opt = { method: method || 'GET' };
  if (body !== undefined) { opt.headers = {'Content-Type':'application/json'}; opt.body = JSON.stringify(body); }
  const r = await fetch(path, opt);
  const j = await r.json();
  if (!r.ok) throw new Error(j.error || r.statusText);
  return j;
}

async function refreshFlows() {
  try {
    const d = await api('/api/flows');
    document.getElementById('globalMeta').textContent =
      `全局并发 ${d.max_parallel} | 资源 ` +
      (Object.keys(d.capacities).length
        ? Object.entries(d.capacities).map(([k,v]) => `${k}: ${(d.usage&&d.usage[k])||0}/${v}`).join('  ')
        : '无');
    let html = '';
    for (const f of d.flows) {
      html += `<div style="margin-bottom:10px">
        <b>${f.name}</b> <span class="muted">(${f.tasks.length} 个任务, 配置 ${f.config_hash})</span>
        <button onclick="startRun('${f.name}')">启动运行</button>
        <div class="flowtask">${f.tasks.map(t =>
          `${t.name}${t.depends_on.length? ' ← '+t.depends_on.join(','):''}` +
          `${Object.keys(t.needs).length? ' ['+Object.entries(t.needs).map(([k,v])=>k+'×'+v).join(',')+']':''}`
        ).join('<br>')}</div></div>`;
    }
    for (const [fn, err] of Object.entries(d.errors)) {
      html += `<div class="err">配置 ${fn} 校验失败:<br>${err}</div>`;
    }
    document.getElementById('flows').innerHTML = html || '<span class="muted">flows/ 目录下没有流程配置</span>';
  } catch (e) { /* 服务可能未就绪 */ }
}

async function refreshRuns() {
  try {
    const d = await api('/api/runs');
    let html = '<table><tr><th>#</th><th>流程</th><th>类型</th><th>状态</th><th>任务统计</th><th>开始时间</th><th></th></tr>';
    for (const r of d.runs) {
      const counts = Object.entries(r.task_counts).map(([k,v]) => `${ST_LABEL[k]||k}×${v}`).join(' ');
      html += `<tr class="runrow ${selectedRun===r.id?'sel':''}" onclick="selectRun(${r.id})">
        <td>${r.id}</td><td>${r.flow_name}</td><td>${ST_LABEL[r.kind]||r.kind}${r.source_run_id? ' #'+r.source_run_id:''}</td>
        <td>${tag(r.status)}</td><td class="muted">${counts}</td><td class="muted">${r.created_at||''}</td>
        <td>${r.status==='running' ? `<button onclick="event.stopPropagation();cancelRun(${r.id})">取消</button>` : ''}
            ${r.status==='interrupted' ? `<button onclick="event.stopPropagation();recoverRun(${r.id})">确认重跑未知任务</button>` : ''}</td></tr>`;
    }
    document.getElementById('runs').innerHTML = d.runs.length ? html+'</table>' : '<span class="muted">还没有运行</span>';
  } catch (e) {}
}

async function selectRun(id) {
  selectedRun = id;
  await refreshDetail();
  refreshRuns();
}

async function refreshDetail() {
  if (selectedRun === null) return;
  let d;
  try { d = await api('/api/runs/' + selectedRun); } catch (e) { return; }
  document.getElementById('detailCard').style.display = '';
  document.getElementById('detailTitle').innerHTML =
    `运行 #${d.id} · ${d.flow_name} · ${tag(d.status)} ` +
    `<span class="muted">类型 ${ST_LABEL[d.kind]||d.kind}${d.source_run_id? ', 来源运行 #'+d.source_run_id:''}${d.rerun_root? ', 重跑根: '+d.rerun_root:''} · 配置 ${d.config_hash}</span>`;
  let warn = '';
  if (d.config_mixed) warn += `<div class="warn">⚠ 本次重跑所用配置与来源运行不同 (${d.config_hash}), 继承的结果来自旧配置 —— 这次运行混合了不同配置的结果, 不能当作一次干净的完整运行。</div>`;
  if (d.status === 'interrupted') warn += `<div class="warn">⚠ 服务上次异常退出, 标记"结果未知"的任务当时可能仍在执行, 结果不能算成功。请确认后点击左侧"确认重跑未知任务"。</div>`;
  if (Object.keys(d.capacities||{}).length)
    warn += `<div class="muted">资源占用: ` + Object.entries(d.capacities).map(([k,v]) => `${k} ${(d.usage&&d.usage[k])||0}/${v}`).join(' · ') + `</div>`;
  document.getElementById('detailWarn').innerHTML = warn;

  let html = '<table><tr><th>任务</th><th>状态</th><th>依赖</th><th>阻塞原因</th><th>尝试</th><th>操作</th></tr>';
  for (const t of d.tasks) {
    const attempts = t.attempts.map(a =>
      `<a class="link" onclick="showLog(${a.id},'${t.name}',${a.attempt_no})">#${a.attempt_no} ${ST_LABEL[a.status]||a.status}` +
      `${a.exit_code!==null&&a.exit_code!==undefined? ' exit='+a.exit_code:''}${a.timed_out?' ⏱':''}` +
      ` <span class="muted">${a.started_at||''}~${a.ended_at||''}</span></a>`).join('<br>');
    const canRerun = ['failed','blocked','unknown'].includes(t.status) && d.status !== 'running';
    html += `<tr><td>${t.name}</td><td>${tag(t.status)}${t.status==='carried'? `<div class="muted">继承自运行 #${t.source_run_id}</div>`:''}</td>
      <td class="muted">${(t.task.depends_on||[]).join(', ')||'-'}</td>
      <td>${t.blocked_by? '<span class="err">被 '+t.blocked_by.join(', ')+' 阻塞</span>':''}</td>
      <td>${attempts||'<span class="muted">-</span>'}</td>
      <td>${canRerun? `<button onclick="rerunTask(${d.id},'${t.name}')">重跑此节点及下游</button>`:''}</td></tr>`;
  }
  document.getElementById('detailBody').innerHTML = html + '</table>';
}

function showLog(attemptId, taskName, no) {
  logAttempt = attemptId; logOffset = 0; logStatus = null;
  document.getElementById('logCard').style.display = '';
  document.getElementById('logTitle').textContent = `日志 · ${taskName} 第 ${no} 次尝试`;
  document.getElementById('logbox').textContent = '';
  refreshLog();
}

async function refreshLog() {
  if (logAttempt === null) return;
  try {
    const d = await api(`/api/attempts/${logAttempt}/log?offset=${logOffset}`);
    if (d.content) {
      const box = document.getElementById('logbox');
      const atBottom = box.scrollTop + box.clientHeight >= box.scrollHeight - 30;
      box.textContent += d.content;
      if (atBottom) box.scrollTop = box.scrollHeight;
    }
    logOffset = d.offset;
  } catch (e) {}
}

async function startRun(flow) {
  try { const d = await api('/api/runs', 'POST', {flow}); selectedRun = d.run_id; refreshAll(); }
  catch (e) { alert('启动失败: ' + e.message); }
}
async function cancelRun(id) {
  try { await api(`/api/runs/${id}/cancel`, 'POST', {}); refreshAll(); }
  catch (e) { alert(e.message); }
}
async function rerunTask(id, task) {
  try { const d = await api(`/api/runs/${id}/rerun`, 'POST', {task}); selectedRun = d.run_id; refreshAll(); }
  catch (e) { alert('重跑失败: ' + e.message); }
}
async function recoverRun(id) {
  if (!confirm('确认重跑运行 #' + id + ' 中结果未知的任务及其下游?')) return;
  try { const d = await api(`/api/runs/${id}/recover`, 'POST', {}); selectedRun = d.run_id; refreshAll(); }
  catch (e) { alert('恢复失败: ' + e.message); }
}

function refreshAll() { refreshFlows(); refreshRuns(); refreshDetail(); }
refreshAll();
setInterval(refreshAll, 1500);
setInterval(refreshLog, 1000);
</script>
</body>
</html>
